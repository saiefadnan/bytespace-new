<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card-wrap { background: white; padding: 20px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="card-wrap" id="container"></div>
  <script>
    fetch('../src/assets/figma/Home.svg')
      .then(r => r.text())
      .then(svgText => {
        // modify svg viewBox to show y=1680 to 2600, x=100 to 1340
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgText, 'image/svg+xml');
        const svg = doc.querySelector('svg');
        svg.setAttribute('viewBox', '100 1740 1240 860');
        svg.setAttribute('width', '1240');
        svg.setAttribute('height', '860');
        document.getElementById('container').appendChild(svg);
      });
  </script>
</body>
</html>
